    verbose: 0  # 0=off, 1=routing, 2=full details+timing, 3=debug with headers/decisions
    backends:
      omlx:
        url: "http://127.0.0.1:8000"
        api_key: "omlx-u6pawwvc56u8dybi"
        type: "anthropic"
      anthropic:
        url: "https://api.anthropic.com"
        type: "anthropic"
    routes:
      haiku:
        backend: "omlx"
        model: "Qwen3.5-9B-MLX-4bit"
